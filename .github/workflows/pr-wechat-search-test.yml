
name: PR WeChat History Search Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-search:
    runs-on: ubuntu-latest
    steps:
      - name: Search and parse WeChat articles
        run: |
          node --input-type=module <<'NODE'
          const query = "DrG的雍熙路";
          const url = "https://weixin.sogou.com/weixin?" +
            new URLSearchParams({
              type: "2",
              query,
              ie: "utf8",
              _sug_: "n",
              _sug_type_: ""
            });

          function clean(s) {
            return (s || "")
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, " ")
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;|&#160;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/\s+/g, " ")
              .trim();
          }

          function attr(tag, name) {
            const re = new RegExp(
              "\\b" + name + "\\s*=\\s*(?:\"([^\"]*)\"|'([^']*)'|([^\\s>]+))",
              "i"
            );
            const m = tag.match(re);
            return m ? (m[1] ?? m[2] ?? m[3] ?? "") : "";
          }

          try {
            const response = await fetch(url, {
              headers: {
                "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
                "Accept-Language": "zh-CN,zh;q=0.9"
              },
              signal: AbortSignal.timeout(20000)
            });

            const html = await response.text();

            console.log("搜索公众号：", query);
            console.log("HTTP 状态：", response.status);
            console.log("网页长度：", html.length, "字符");
            console.log("验证码提示：", /验证码|访问过于频繁|异常访问/.test(html));

            const blocks = html.match(/<li\b[^>]*>[\s\S]*?<\/li>/gi) || [];
            const results = [];

            for (const block of blocks) {
              const h3 = block.match(/<h3\b[^>]*>[\s\S]*?<\/h3>/i);
              if (!h3) continue;

              const a = h3[0].match(/<a\b[^>]*>/i);
              if (!a) continue;

              const title = clean(h3[0]);
              let link = attr(a[0], "href");
              if (link.startsWith("/")) {
                link = "https://weixin.sogou.com" + link;
              }

              if (!title || !link) continue;

              const sourceMatch = block.match(
                /class=["'][^"']*\bs-p\b[^"']*["'][^>]*>[\s\S]*?(?=<\/li>)/i
              );
              const source = sourceMatch ? clean(sourceMatch[0]) : "";

              const summaryMatch = block.match(
                /class=["'][^"']*\btxt-info\b[^"']*["'][^>]*>([\s\S]*?)<\/p>/i
              );
              const summary = summaryMatch ? clean(summaryMatch[1]) : "";

              results.push({ title, link, source, summary });
            }

            console.log("识别到的文章候选数：", results.length);

            for (const [i, item] of results.slice(0, 20).entries()) {
              console.log(`--- 候选 ${i + 1} ---`);
              console.log("标题：", item.title);
              console.log("来源及日期信息：", item.source || "未提取到");
              console.log("摘要：", item.summary || "无");
              console.log("搜索链接：", item.link);
            }

            if (!response.ok) {
              console.log("结果：搜狗返回非成功状态。");
            } else if (results.length) {
              console.log("结果：已识别候选文章，需核对来源及日期。");
            } else {
              console.log("结果：仍未识别到文章，请检查页面结构或搜索限制。");
              console.log("页面片段：", html.slice(0, 1500));
            }
          } catch (error) {
            console.log("搜索失败：", error.message);
          }
          NODE
