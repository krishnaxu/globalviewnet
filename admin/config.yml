backend:
  name: github
  repo: krishnaxu/globalviewnet
  branch: main
  base_url: https://globalviewnet.pages.dev
  auth_endpoint: /api/auth

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: posts
    label: 文章
    folder: content/posts
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 日期, widget: datetime, format: YYYY-MM-DD }
      - { name: body, label: 正文, widget: markdown }
