name: Preview Global RSS News

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-global-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preview RSS news titles
        run: node scripts/preview-global-rss.mjs
