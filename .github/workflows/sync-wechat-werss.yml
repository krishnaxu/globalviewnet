name: Sync WeChat articles from WeRSS

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wechat-werss
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate configuration
        env:
          WERSS_FEED_URL: ${{ secrets.WERSS_FEED_URL }}
        run: |
          if [ -z "$WERSS_FEED_URL" ]; then
            echo "::error::Repository secret WERSS_FEED_URL is missing."
            exit 1
          fi

      - name: Sync new WeChat articles
        env:
          WERSS_FEED_URL: ${{ secrets.WERSS_FEED_URL }}
          WERSS_AUTHORIZATION: ${{ secrets.WERSS_AUTHORIZATION }}
          WECHAT_ACCOUNT_NAME: ${{ vars.WECHAT_ACCOUNT_NAME }}

          TARGET_FILE: content/pr-portfolio/wechat-articles.json
          STATE_FILE: content/pr-portfolio/wechat-sync-state.json

          INITIAL_SYNC_MODE: baseline
          MAX_NEW_ITEMS: "50"
          REQUEST_TIMEOUT: "30"

        run: |
          python3 scripts/sync_wechat_werss.py

      - name: Validate generated JSON
        run: |
          python3 -m json.tool \
            content/pr-portfolio/wechat-sync-state.json \
            >/dev/null

          if [ -f content/pr-portfolio/wechat-articles.json ]; then
            python3 -m json.tool \
              content/pr-portfolio/wechat-articles.json \
              >/dev/null
          fi

          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git add \
            content/pr-portfolio/wechat-sync-state.json

          if [ -f content/pr-portfolio/wechat-articles.json ]; then
            git add \
              content/pr-portfolio/wechat-articles.json
          fi

          if git diff --cached --quiet; then
            echo "No new article; nothing to commit."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Sync new WeChat articles"

          git pull \
            --rebase \
            origin \
            main

          git push \
            origin \
            HEAD:main
