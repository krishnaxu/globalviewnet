
name: PR WeChat Search Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and export Sogou results
        run: |
          cat > /tmp/sogou-export.mjs <<'EOF'
          import fs from 'node:fs/promises';

          const ACCOUNT = 'DrG的雍熙路';
          const queries = [
            ACCOUNT,
            '"DrG的雍熙路" 生物医药',
            '"DrG的雍熙路" 金斯瑞'
          ];

          const results = [];
          const seen = new Set();
          const errors = [];

          function decode(s = '') {
            return s
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&#39;|&#x27;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, ' ')
              .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
              .replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)));
          }

          function clean(s = '') {
            return decode(s.replace(/<script[\s\S]*?<\/script>/gi, '')
              .replace(/<style[\s\S]*?<\/style>/gi, '')
              .replace(/<[^>]+>/g, ' '))
              .replace(/\s+/g, ' ').trim();
          }

          function getDate(text) {
            const m = text.match(/20\d{2}\s*[年\-/.]\s*\d{1,2}\s*[月\-/.]\s*\d{1,2}\s*日?/);
            if (!m) return null;
            const p = m[0].match(/\d+/g).map(Number);
            return `${p[0]}-${String(p[1]).padStart(2, '0')}-${String(p[2]).padStart(2, '0')}`;
          }

          function extract(html, query, page) {
            const cards = [];
            const blocks = html.match(/<li\b[^>]*class=["'][^"']*(?:news-list|news-box|news-item)[^"']*["'][\s\S]*?<\/li>/gi) || [];

            for (const block of blocks) {
              const titleMatch = block.match(/<h[23]\b[^>]*>[\s\S]*?<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>[\s\S]*?<\/h[23]>/i)
                || block.match(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/i);

              if (!titleMatch) continue;

              const title = clean(titleMatch[2]);
              if (!title || title.length < 5) continue;

              const link = decode(titleMatch[1]);
              const text = clean(block);

              cards.push({
                title,
                search_result_url: link.startsWith('http') ? link : `https://weixin.sogou.com${link}`,
                publish_date: getDate(text),
                account_mentioned_in_result: text.includes(ACCOUNT),
                query,
                page,
                result_text: text
              });
            }
            return cards;
          }

          function request(url) {
            return new Promise((resolve, reject) => {
              const req = fetch(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9',
                  'Referer': 'https://weixin.sogou.com/'
                },
                signal: AbortSignal.timeout(15000)
              }).then(async res => resolve({
                status: res.status,
                html: await res.text()
              })).catch(reject);
            });
          }

          for (const query of queries) {
            for (let page = 1; page <= 5; page++) {
              const url = new URL('https://weixin.sogou.com/weixin');
              url.searchParams.set('type', '2');
              url.searchParams.set('query', query);
              url.searchParams.set('page', String(page));
              url.searchParams.set('ie', 'utf8');

              try {
                const res = await request(url.href);
                console.log(`查询=${query} 第${page}页 HTTP=${res.status} HTML=${res.html.length}`);

                if (res.status !== 200 || res.html.length < 1000) {
                  errors.push({ query, page, error: `HTTP ${res.status} 或页面内容过短` });
                  break;
                }

                if (/antispider|请输入验证码|访问过于频繁|异常访问/i.test(res.html)) {
                  errors.push({ query, page, error: '搜狗返回反爬验证页面' });
                  break;
                }

                const cards = extract(res.html, query, page);
                console.log(`本页解析到 ${cards.length} 条候选`);

                for (const item of cards) {
                  const key = `${item.title}|${item.search_result_url}`;
                  if (seen.has(key)) continue;
                  seen.add(key);
                  results.push(item);
                }

                await new Promise(r => setTimeout(r, 1000));
              } catch (e) {
                errors.push({ query, page, error: String(e.message || e) });
                break;
              }
            }
          }

          const start = '2022-11-01';
          const today = new Date().toISOString().slice(0, 10);

          const report = {
            generated_at: new Date().toISOString(),
            account: ACCOUNT,
            requested_date_range: { from: start, to: today },
            note: '搜索引擎候选结果，不保证覆盖公众号全部历史文章。日期和原文链接需要核验。',
            stats: {
              unique_candidates: results.length,
              account_mentioned: results.filter(x => x.account_mentioned_in_result).length,
              date_extracted: results.filter(x => x.publish_date).length,
              date_in_range: results.filter(x =>
                x.publish_date && x.publish_date >= start && x.publish_date <= today
              ).length,
              errors: errors.length
            },
            errors,
            articles: results
          };

          await fs.mkdir('sogou-test-output', { recursive: true });
          await fs.writeFile(
            'sogou-test-output/sogou-test-results.json',
            JSON.stringify(report, null, 2),
            'utf8'
          );

          console.log('\n===== 汇总 =====');
          console.log(JSON.stringify(report.stats, null, 2));
          console.log('JSON 测试文件已生成。');
          EOF

          node /tmp/sogou-export.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sogou-test-results
          path: sogou-test-output/sogou-test-results.json
          if-no-files-found: warn
          retention-days: 7
