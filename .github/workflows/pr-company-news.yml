name: PR Company News Fetch

on:
  workflow_dispatch:
 schedule:
  - cron: "37 2 * * 1"

permissions:
  contents: write

concurrency:
  group: pr-company-news-fetch
  cancel-in-progress: false

jobs:
  fetch-company-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch company news
        run: node scripts/pr-company-news.mjs

      - name: Commit company news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pr-portfolio/company-news.json
          if git diff --cached --quiet; then
            echo "No company news changes to commit."
          else
            git commit -m "Update PR company news archive"
            git push
          fi
