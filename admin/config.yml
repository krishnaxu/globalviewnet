backend:
  name: github
  repo: krishnaxu/globalviewnet   # 【必改】确认这是你的真实仓库路径
  branch: main
  base_url: https://globalviewnet.pages.dev   # 已修正拼写，一字不差
  auth_endpoint: /api/auth        # 【必开】不能注释，配合 callback.js
media_folder: "static/images"
public_folder: "/images"
collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "body", label: "Body", widget: "markdown" }
