
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index,follow">
  <title>GlobalViewNet</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f8fa;
      color: #202938;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    main {
      width: 100%;
      max-width: 760px;
      padding: 48px 32px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      text-align: center;
    }
    h1 { font-size: clamp(30px, 6vw, 48px); margin: 0 0 16px; }
    p { color: #667085; line-height: 1.8; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 22px;
      border-radius: 8px;
      background: #315be8;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>GlobalViewNet</h1>
    <p>欢迎访问 GlobalViewNet。</p>
    <a href="/admin/">进入管理后台</a>
  </main>
</body>
</html>
