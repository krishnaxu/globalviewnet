
backend:
  name: github
  repo: krishnaxu/globalviewnet
  branch: main
  base_url: https://globalviewnet.pages.dev
  auth_endpoint: /api/auth
  site_url: https://globalviewnet.pages.dev

media_folder: "public/images/uploads"
public_folder: "/public/images/uploads"

collections:
  - name: "posts"
    label: "文章管理"
    label_singular: "文章"
    folder: "content/posts"
    create: true
    identifier_field: "slug"
    slug: "{{fields.slug}}"
    summary: "{{title_zh}} / {{title_en}}"

    fields:
      - label: "文章标识（用于网址）"
        name: "slug"
        widget: "string"
        required: true
        hint: "填写英文小写字母、数字和连字符，例如 ai-industry-001。创建后尽量不要修改。"

      - label: "板块"
        name: "category"
        widget: "select"
        options:
          - label: "科技"
            value: "tech"
          - label: "商业"
            value: "business"
          - label: "文化"
            value: "culture"
          - label: "生活"
            value: "life"
        default: "tech"
        required: true

      - label: "发布日期"
        name: "date"
        widget: "datetime"
        required: true

      - label: "是否发布到网站"
        name: "published"
        widget: "boolean"
        default: false
        required: true
        hint: "勾选后，文章才会显示在网站首页和文章列表。"
        
      - label: "设为热门文章"
        name: "is_hot"
        widget: "boolean"
        default: false
        required: true
        hint: "勾选后，该文章将进入首页热门阅读模块；取消勾选则不进入。"

      - label: "封面图片"
        name: "cover_image"
        widget: "image"
        required: false

      - label: "来源名称"
        name: "source_name"
        widget: "string"
        required: false

      - label: "来源链接"
        name: "source_url"
        widget: "string"
        required: false

      - label: "中文标题"
        name: "title_zh"
        widget: "string"
        required: false

      - label: "中文摘要"
        name: "excerpt_zh"
        widget: "text"
        required: false

      - label: "中文正文"
        name: "body_zh"
        widget: "markdown"
        required: false

      - label: "English Title（英文标题）"
        name: "title_en"
        widget: "string"
        required: false

      - label: "English Summary（英文摘要）"
        name: "excerpt_en"
        widget: "text"
        required: false

      - label: "English Body（英文正文）"
        name: "body_en"
        widget: "markdown"
        required: false
