
name: Auto News Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: auto-news-hourly
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect RSS news
        run: node scripts/auto-news-hourly.mjs

      - name: Commit generated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-news auto-news.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update automatically collected news"
            git push origin HEAD:main
          else
            echo "No changes to publish."
          fi
