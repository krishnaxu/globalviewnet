name: WeChat automatic collection

on:
  workflow_dispatch:
  schedule:
    - cron: "25 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: wechat-automatic-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify script is intact
        run: |
          set -euo pipefail
          node --check scripts/wechat-resolve.mjs
          node -e 'const fs=require("fs"),c=require("crypto");const s=fs.readFileSync("scripts/wechat-resolve.mjs","utf8").replace(/\s+/g,"");const x=c.createHash("sha256").update(s).digest("hex");console.log("fingerprint "+x.slice(0,8));if(x!=="c56dc3cdf602d2f6d81f822df998255e464cfa399f08ae6d4e5d6c00763b17d0")throw new Error("wechat-resolve.mjs 与预期内容不一致，粘贴时被改动，请重新全量粘贴")'

      - name: Install browser
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Discover and archive WeChat articles
        run: |
          set -euo pipefail
          node scripts/wechat-resolve.mjs

      - name: Commit and push changes
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/pr-portfolio/wechat-articles.json wechat-backfill-state.json

          if git diff --cached --quiet; then
            echo "没有新增微信文章"
            exit 0
          fi

          git commit -m "chore: automatically collect WeChat articles"
          git pull --rebase origin main
          git push origin HEAD:main
