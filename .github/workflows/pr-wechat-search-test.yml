
name: PR WeChat History Search Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-search:
    runs-on: ubuntu-latest
    steps:
      - name: Test pagination and original links
        run: |
          node --input-type=module <<'NODE'
          const query = "DrG的雍熙路";

          function clean(s) {
            return (s || "")
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, " ")
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;|&#160;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/\s+/g, " ")
              .trim();
          }

          function attr(tag, name) {
            const re = new RegExp(
              "\\b" + name + "\\s*=\\s*(?:\"([^\"]*)\"|'([^']*)'|([^\\s>]+))",
              "i"
            );
            const m = tag.match(re);
            return m ? (m[1] ?? m[2] ?? m[3] ?? "") : "";
          }

          for (let page = 1; page <= 5; page++) {
            const url = "https://weixin.sogou.com/weixin?" +
              new URLSearchParams({
                type: "2",
                query,
                ie: "utf8",
                page: String(page),
                _sug_: "n",
                _sug_type_: ""
              });

            console.log(`\n========== 第 ${page} 页 ==========`);

            try {
              const response = await fetch(url, {
                headers: {
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36",
                  "Accept-Language": "zh-CN,zh;q=0.9"
                },
                signal: AbortSignal.timeout(20000)
              });

              const html = await response.text();
              const blocks = html.match(/<li\b[^>]*>[\s\S]*?<\/li>/gi) || [];
              const results = [];

              for (const block of blocks) {
                const h3 = block.match(/<h3\b[^>]*>[\s\S]*?<\/h3>/i);
                if (!h3) continue;

                const a = h3[0].match(/<a\b[^>]*>/i);
                if (!a) continue;

                const title = clean(h3[0]);
                const link = attr(a[0], "href");
                const account = clean(
                  (block.match(/<p\b[^>]*class=["'][^"']*\bs-p\b[^"']*["'][^>]*>[\s\S]*?<\/p>/i) || [""])[0]
                );

                const dateCandidates = [
                  ...block.matchAll(/(?:ct|timestamp|time|date)[^0-9]{0,30}(\d{10,13})/gi)
                ].map(m => m[1]);

                const dateText = [
                  ...block.matchAll(/\b20\d{2}[-/.年]\d{1,2}[-/.月]\d{1,2}日?/g)
                ].map(m => m[0]);

                if (title && link) {
                  results.push({ title, link, account, dateCandidates, dateText });
                }
              }

              console.log("HTTP 状态：", response.status);
              console.log("页面长度：", html.length);
              console.log("候选数：", results.length);

              if (results.length === 0) {
                console.log("页面无结果，停止分页。");
                break;
              }

              for (const item of results) {
                console.log("标题：", item.title);
                console.log("来源：", item.account);
                console.log("日期线索：", [
                  ...item.dateText,
                  ...item.dateCandidates
                ].join(", ") || "未识别");
                console.log("搜狗链接：", item.link);
              }

              if (page === 1 && results.length > 0) {
                const link = results[0].link;
                const resolved = link.startsWith("/")
                  ? "https://weixin.sogou.com" + link
                  : link;

                try {
                  const r = await fetch(resolved, {
                    headers: {
                      "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36"
                    },
                    redirect: "follow",
                    signal: AbortSignal.timeout(15000)
                  });
                  console.log("\n首条链接跳转测试：");
                  console.log("HTTP 状态：", r.status);
                  console.log("最终地址：", r.url);
                  console.log("是否为微信原文：", r.url.includes("mp.weixin.qq.com/s/"));
                  await r.body?.cancel();
                } catch (e) {
                  console.log("\n首条链接跳转失败：", e.message);
                }
              }

              await new Promise(resolve => setTimeout(resolve, 1200));
            } catch (error) {
              console.log("本页请求失败：", error.message);
              break;
            }
          }
          NODE
