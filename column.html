
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <title>我的专栏 | Global View</title>
  <style>
    :root {
      --bg: #f8f7f3;
      --card: #ffffff;
      --text: #252821;
      --muted: #777a72;
      --border: #e6e4dc;
      --accent: #9a7547;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }

    .container {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 22px 0;
      border-bottom: 1px solid var(--border);
    }

    .back-link {
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--accent);
    }

    main {
      padding: 38px 0 60px;
    }

    h1 {
      margin: 0 0 8px;
      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: clamp(28px, 5vw, 38px);
      font-weight: 500;
      line-height: 1.35;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
    }

    .count {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .article-list {
      display: grid;
      gap: 14px;
    }

    .article-card {
      display: block;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s;
    }

    .article-card:hover {
      border-color: var(--accent);
    }

    .article-title {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.55;
    }

    .article-excerpt {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .article-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      padding: 24px 0;
      color: var(--muted);
      font-size: 14px;
    }

    
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 28px;
      font-size: 14px;
    }

    .pagination button {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pagination button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .page-indicator {
      color: var(--muted);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      main {
        padding-top: 26px;
      }

      .article-card {
        padding: 16px;
      }

      .article-title {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <a class="back-link" href="/">← 返回首页</a>
    </div>
  </header>

  <main class="container">
    <h1>我的专栏</h1>
    <p class="intro">文章与观点，持续更新。</p>

    <div class="count" id="articleCount">正在加载文章……</div>
    <div class="article-list" id="articleList"></div>

<nav class="pagination" id="pagination"
     aria-label="专栏文章分页" hidden>
  <button type="button" id="prevPage">上一页</button>
  <span class="page-indicator" id="pageIndicator">第 1 / 1 页</span>
  <button type="button" id="nextPage">下一页</button>
</nav>
    <p class="status" id="status" role="status"></p>
  </main>

  <script>
    (async function () {
      "use strict";

      const list = document.getElementById("articleList");
      
      const pagination = document.getElementById("pagination");
      const prevPageButton = document.getElementById("prevPage");
      const nextPageButton = document.getElementById("nextPage");
      const pageIndicator = document.getElementById("pageIndicator");

      const pageSize = 10;
      let currentPage = 1;
      let posts = [];

      const count = document.getElementById("articleCount");
      const status = document.getElementById("status");

      function isTrue(value) {
        return value === true ||
          String(value || "").trim().toLowerCase() === "true";
      }

      function dateValue(value) {
        const timestamp = Date.parse(value || "");
        return Number.isFinite(timestamp) ? timestamp : 0;
      }

      function displayDate(value) {
        if (!value) return "";

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";

        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "long",
          day: "numeric"
        }).format(date);
      }

      function addText(parent, tag, className, value) {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = value || "";
        parent.appendChild(element);
        return element;
      }

      try {
        const response = await fetch("/api/posts", {
          headers: { Accept: "application/json" },
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("文章数据请求失败");
        }

        const data = await response.json();

        if (!data.success || !Array.isArray(data.posts)) {
          throw new Error("文章数据格式不正确");
        }

       posts = data.posts
          .filter(post =>
            post.slug &&
            isTrue(post.show_in_column) &&
            post.published !== false &&
            String(post.published).toLowerCase() !== "false"
          )
          .slice()
          .sort((a, b) =>
            dateValue(b.updatedAt || b.updated_at || b.date) -
            dateValue(a.updatedAt || a.updated_at || a.date)
          );

        count.textContent = `共 ${posts.length} 篇文章`;

        if (posts.length === 0) {
          status.textContent = "暂时没有已发布的专栏文章。";
          return;
        }


        function renderPage() {
          const totalPages = Math.ceil(posts.length / pageSize);
          const startIndex = (currentPage - 1) * pageSize;
          const pagePosts = posts.slice(
            startIndex,
            startIndex + pageSize
          );

          list.replaceChildren();

          pagePosts.forEach(post => {
            const link = document.createElement("a");
            link.className = "article-card";

            const url = post.url_zh || post.url_en;

            if (url) {
              link.href = url;
            } else {
              link.href = "#";
              link.addEventListener("click", event => {
                event.preventDefault();
              });
            }

            addText(
              link,
              "h2",
              "article-title",
              post.title_zh || post.title || post.slug
            );

            const excerpt = post.excerpt_zh || post.excerpt || "";

            if (excerpt) {
              addText(link, "p", "article-excerpt", excerpt);
            }

            addText(
              link,
              "div",
              "article-meta",
              [
                post.category || "",
                displayDate(post.updatedAt || post.updated_at || post.date)
              ].filter(Boolean).join(" · ")
            );

            list.appendChild(link);
          });

          pagination.hidden = totalPages <= 1;
          pageIndicator.textContent =
            `第 ${currentPage} / ${totalPages} 页`;

          prevPageButton.disabled = currentPage <= 1;
          nextPageButton.disabled = currentPage >= totalPages;
        }

        prevPageButton.addEventListener("click", () => {
          if (currentPage > 1) {
            currentPage--;
            renderPage();
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        });

        nextPageButton.addEventListener("click", () => {
          const totalPages = Math.ceil(posts.length / pageSize);

          if (currentPage < totalPages) {
            currentPage++;
            renderPage();
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        });

        renderPage();

      } catch (error) {
        console.error("专栏文章加载失败：", error);
        count.textContent = "文章加载失败";
        status.textContent =
          "暂时无法加载专栏文章，请稍后刷新页面。";
      }
    })();
  </script>
</body>
</html>
