backend:
  name: github
  repo: krishnaxu/globalviewnet
  branch: main
  base_url: https://globalviewnet.pages.dev
  auth_endpoint: /api/auth
  site_url: https://globalviewnet.pages.dev

media_folder: "public/images/uploads"
public_folder: "/public/images/uploads"

collections:
  - name: "posts"
    label: "文章管理"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "板块"
        name: "category"
        widget: "select"
        options:
          - label: "科技"
            value: "tech"
          - label: "商业"
            value: "business"
          - label: "文化"
            value: "culture"
          - label: "生活"
            value: "life"
        default: "tech"
        required: true

      - label: "日期"
        name: "date"
        widget: "datetime"
        required: true

      - label: "封面图片"
        name: "cover_image"
        widget: "image"
        required: false

      - label: "来源名称"
        name: "source_name"
        widget: "string"
        required: false

      - label: "来源链接"
        name: "source_url"
        widget: "string"
        required: false

      - label: "中文标题"
        name: "title_zh"
        widget: "string"
        required: false

      - label: "中文摘要"
        name: "excerpt_zh"
        widget: "text"
        required: false

      - label: "中文正文"
        name: "body_zh"
        widget: "markdown"
        required: false

      - label: "English Title"
        name: "title_en"
        widget: "string"
        required: false

      - label: "English Summary"
        name: "excerpt_en"
        widget: "text"
        required: false

      - label: "English Body"
        name: "body_en"
        widget: "markdown"
        required: false
