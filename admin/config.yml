
backend:
  name: github
  repo: krishnaxu/globalviewnet
  branch: main
  base_url: https://globalviewnet.pages.dev
  auth_endpoint: /api/auth
  site_url: https://globalviewnet.pages.dev

media_folder: "public/images/uploads"
public_folder: "/public/images/uploads"

collections:
  - name: "posts"
    label: "文章管理"
    label_singular: "文章"
    folder: "content/posts"
    create: true
    identifier_field: "slug"
    slug: "{{fields.slug}}"
    summary: "{{title_zh}} / {{title_en}}"

    fields:
      - label: "文章标识（用于网址）"
        name: "slug"
        widget: "string"
        required: true
        hint: "填写英文小写字母、数字和连字符，例如 ai-industry-001。创建后尽量不要修改。"

      - label: "板块"
        name: "category"
        widget: "select"
        options:
          - label: "科技"
            value: "tech"
          - label: "商业"
            value: "business"
          - label: "文化"
            value: "culture"
          - label: "生活"
            value: "life"
        default: "tech"
        required: true

        
      - label: "发布到我的专栏"
        name: "show_in_column"
        widget: "boolean"
        default: false
        required: true
        hint: "勾选后，该文章将显示在首页“我的专栏”列表中。"


      - label: "发布日期"
        name: "date"
        widget: "datetime"
        required: true

      - label: "是否发布到网站"
        name: "published"
        widget: "boolean"
        default: false
        required: true
        hint: "勾选后，文章才会显示在网站首页和文章列表。"

      - label: "设为热门文章"
        name: "is_hot"
        widget: "boolean"
        default: false
        required: true
        hint: "勾选后，该文章将进入首页热门阅读模块；取消勾选则不进入。"

      - label: "封面图片"
        name: "cover_image"
        widget: "image"
        required: false

      - label: "来源名称"
        name: "source_name"
        widget: "string"
        required: false

      - label: "来源链接"
        name: "source_url"
        widget: "string"
        required: false

      - label: "中文标题"
        name: "title_zh"
        widget: "string"
        required: false

      - label: "中文摘要"
        name: "excerpt_zh"
        widget: "text"
        required: false

      - label: "中文正文"
        name: "body_zh"
        widget: "text"
        required: false
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-one
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        modes:
          - rich_text
          - raw

      - label: "English Title（英文标题）"
        name: "title_en"
        widget: "string"
        required: false

      - label: "English Summary（英文摘要）"
        name: "excerpt_en"
        widget: "text"
        required: false

      - label: "English Body（英文正文）"
        name: "body_en"
        widget: "text"
        required: false
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-one
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        modes:
          - rich_text
          - raw

  - name: "site_settings"
    label: "网站图片设置"
    files:
      - label: "四大板块通用图片"
        name: "category_images"
        file: "content/site-settings.json"
        fields:
          - label: "科技通用图"
            name: "tech"
            widget: "image"
            required: false

          - label: "商业通用图"
            name: "business"
            widget: "image"
            required: false

          - label: "文化通用图"
            name: "culture"
            widget: "image"
            required: false

          - label: "生活通用图"
            name: "life"
            widget: "image"
            required: false

  - name: "auto_news"
    label: "自动新闻管理"
    label_singular: "自动新闻"
    folder: "content/auto-news"
    create: true
    identifier_field: "slug"
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    fields:
      - label: "新闻标识（用于网址）"
        name: "slug"
        widget: "string"
        required: true

      - label: "新闻语言"
        name: "language"
        widget: "select"
        options:
          - label: "中文"
            value: "zh"
          - label: "English"
            value: "en"
        default: "zh"
        required: true

      - label: "新闻标题"
        name: "title"
        widget: "string"
        required: true

      - label: "新闻摘要"
        name: "excerpt"
        widget: "text"
        required: false

      - label: "发布日期"
        name: "date"
        widget: "datetime"
        required: true

      - label: "媒体来源"
        name: "source_name"
        widget: "string"
        required: true

      - label: "原文链接"
        name: "source_url"
        widget: "string"
        required: true

      - label: "是否发布"
        name: "published"
        widget: "boolean"
        default: true
        required: true

      - label: "新闻正文"
        name: "body"
        widget: "markdown"
        required: false

  - name: "works"
    label: "我的作品"
    label_singular: "作品"
    folder: "content/works"
    create: true
    identifier_field: "slug"
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    fields:
      - label: "作品标识（用于文件名）"
        name: "slug"
        widget: "string"
        required: true
        hint: "填写英文小写字母、数字和连字符，例如 people-report-001。"

      - label: "人民网原文链接"
        name: "original_url"
        widget: "string"
        required: true

      - label: "作品标题"
        name: "title"
        widget: "string"
        required: true

      - label: "发表平台"
        name: "platform"
        widget: "string"
        default: "人民网"
        required: true

      - label: "发布日期"
        name: "date"
        widget: "datetime"
        required: false

      - label: "作品简介"
        name: "excerpt"
        widget: "text"
        required: false

      - label: "封面图片"
        name: "cover_image"
        widget: "image"
        required: false
        
      - label: "发布到首页"
        name: "published"
        widget: "boolean"
        default: false
        required: true

      - label: "作品正文"
        name: "body"
        widget: "markdown"
        required: false
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        modes:
          - rich_text
          - raw
