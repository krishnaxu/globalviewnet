backend:
  name: github
  repo: 你的用户名/你的仓库名
  branch: main
  base_url: https://globalviewnet.pages.dev
  # auth_endpoint 必须注释或删除！
media_folder: "static/images"
public_folder: "/images"
collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "body", label: "Body", widget: "markdown" }
