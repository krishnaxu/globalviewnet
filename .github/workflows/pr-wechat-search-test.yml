name: WeChat automatic collection

on:
  workflow_dispatch:

  schedule:
    - cron: "25 0,6,12,18 * * *"

  push:
    branches:
      - main
    paths:
      - "content/pr-portfolio/wechat-seed-urls.txt"

permissions:
  contents: write

concurrency:
  group: wechat-automatic-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Check collector script
        run: |
          set -euo pipefail

          if [ ! -f scripts/wechat-resolve.mjs ]; then
            echo "::error::Missing scripts/wechat-resolve.mjs"
            exit 1
          fi

          node --check scripts/wechat-resolve.mjs

      - name: Install Playwright
        run: |
          set -euo pipefail

          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Discover and archive new WeChat articles
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: |
          set -euo pipefail
          node scripts/wechat-resolve.mjs

      - name: Validate generated files
        run: |
          set -euo pipefail

          if [ -f content/pr-portfolio/wechat-articles.json ]; then
            node -e '
              const fs = require("fs");
              const file = "content/pr-portfolio/wechat-articles.json";
              const data = JSON.parse(fs.readFileSync(file, "utf8"));

              if (!Array.isArray(data)) {
                throw new Error("wechat-articles.json 顶层必须是数组");
              }

              for (const item of data) {
                if (!item || typeof item !== "object") {
                  throw new Error("wechat-articles.json 包含无效记录");
                }

                if (!item.title || !item.source_url) {
                  throw new Error(
                    "发现缺少 title 或 source_url 的微信文章记录"
                  );
                }
              }

              console.log(
                "wechat-articles.json validated:",
                data.length,
                "articles"
              );
            '
          fi

          if [ -f wechat-backfill-state.json ]; then
            node -e '
              const fs = require("fs");
              JSON.parse(
                fs.readFileSync(
                  "wechat-backfill-state.json",
                  "utf8"
                )
              );
              console.log(
                "wechat-backfill-state.json validated"
              );
            '
          fi

          git diff --check

      - name: Commit and push new articles
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f content/pr-portfolio/wechat-articles.json ]; then
            git add \
              content/pr-portfolio/wechat-articles.json
          fi

          if [ -f wechat-backfill-state.json ]; then
            git add \
              wechat-backfill-state.json
          fi

          if git diff --cached --quiet; then
            echo "没有发现新增微信文章"
            exit 0
          fi

          git commit \
            -m "chore: automatically collect new WeChat articles"

          git pull \
            --rebase \
            origin \
            main

          git push \
            origin \
            HEAD:main
