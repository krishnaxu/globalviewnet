
name: PR WeChat History Search Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-original-links:
    runs-on: ubuntu-latest
    steps:
      - name: Search article titles for original WeChat links
        run: |
          node --input-type=module <<'NODE'
          const titles = [
            'AI制药的“淘金热”里，金斯瑞正在抢一把什么样的铲子？',
            '死亡风险降低32%，生存期延长近7个月！默沙东/科伦博泰TROP2 ADC攻克子宫内膜癌治疗难关'
          ];

          function decodeHtml(s) {
            return s
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&#39;|&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>');
          }

          for (const title of titles) {
            console.log('\n====================================');
            console.log('查询标题：' + title);

            const query = `site:mp.weixin.qq.com/s "${title}"`;
            const url = 'https://www.google.com/search?q=' +
              encodeURIComponent(query);

            try {
              const response = await fetch(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36'
                },
                signal: AbortSignal.timeout(20000)
              });

              const html = await response.text();
              console.log('HTTP 状态：' + response.status);
              console.log('页面长度：' + html.length);

              const found = new Set();
              const pattern = /https?:\\?\/\\?\/mp\.weixin\.qq\.com\\?\/s(?:[/?][^"'<>\\\s]*)?/g;

              for (const match of html.matchAll(pattern)) {
                let link = decodeHtml(match[0])
                  .replace(/\\\//g, '/')
                  .replace(/\\u003d/g, '=')
                  .replace(/\\u0026/g, '&')
                  .replace(/[),.;]+$/, '');

                if (link.startsWith('http')) {
                  found.add(link);
                }
              }

              const links = [...found];
              console.log('识别到的微信链接数：' + links.length);

              for (const link of links.slice(0, 10)) {
                console.log('微信链接：' + link);
              }

              const text = decodeHtml(html)
                .replace(/<script[\s\S]*?<\/script>/gi, ' ')
                .replace(/<style[\s\S]*?<\/style>/gi, ' ')
                .replace(/<[^>]+>/g, ' ')
                .replace(/\s+/g, ' ');

              console.log('搜索页包含标题文字：' + text.includes(title));
              console.log('搜索结果片段：' + text.slice(0, 1200));
            } catch (error) {
              console.log('查询失败：' + error.message);
            }
          }
          NODE
