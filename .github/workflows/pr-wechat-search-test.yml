name: WeChat automatic collection

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */4 * * *"

permissions:
  contents: write

concurrency:
  group: wechat-automatic-collection
  cancel-in-progress: false

jobs:
  collect-wechat-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect WeChat articles
        run: |
          set -euo pipefail
          node scripts/wechat-search.mjs

      - name: Validate generated files
        run: |
          set -euo pipefail
          test -f auto-news.json
          test -f wechat-news.json

          node -e 'const fs=require("fs"); const items=JSON.parse(fs.readFileSync("wechat-news.json","utf8")); if(!Array.isArray(items)) throw new Error("wechat-news.json 顶层不是数组"); const invalid=items.filter(item=>{try{const u=new URL(item.url||item.link);return u.hostname!=="mp.weixin.qq.com"||!(u.pathname==="/s"||u.pathname.startsWith("/s/"));}catch{return true;}}); if(invalid.length) throw new Error("发现非微信文章："+invalid.length+"条"); console.log("真实微信文章数量："+items.length);'

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add auto-news.json wechat-news.json

          if git diff --cached --quiet; then
            echo "没有数据变化，不需要提交"
            exit 0
          fi

          git commit -m "chore: update verified WeChat news"
          git pull --rebase origin main
          git push origin HEAD:main
