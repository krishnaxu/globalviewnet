name: WeChat automatic collection

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */4 * * *"

permissions:
  contents: write

concurrency:
  group: wechat-automatic-collection
  cancel-in-progress: false

jobs:
  collect-wechat-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show environment
        run: |
          node --version
          pwd
          ls -la
          ls -la scripts

      - name: Collect WeChat articles
        run: |
          set -euo pipefail
          node scripts/wechat-search.mjs

      - name: Validate generated files
        run: |
          set -euo pipefail

          test -f auto-news.json
          test -f wechat-news.json

          node -e 'const fs=require("fs"); const wechat=JSON.parse(fs.readFileSync("wechat-news.json","utf8")); if(!Array.isArray(wechat)) throw new Error("wechat-news.json 顶层不是数组"); if(wechat.length===0) throw new Error("wechat-news.json 中没有文章"); for(const item of wechat){if(!item.title||!item.url) throw new Error("存在缺少标题或链接的微信文章");} console.log("微信文章数量："+wechat.length); console.log("最新文章："+wechat[0].title);'

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add auto-news.json wechat-news.json

          if git diff --cached --quiet; then
            echo "没有新增微信文章，不需要提交"
            exit 0
          fi

          git commit -m "chore: update automatically collected WeChat news"
          git pull --rebase origin main
          git push origin HEAD:main
