<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="robots" content="noindex,nofollow">
  <title>Global View · Modern Homepage Test</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
      color: #081526;
      background: #f4f7fb;
    }

    .gv-bootstrap {
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .gv-bootstrap__box {
      max-width: 560px;
      padding: 32px;
      border: 1px solid #dce5ef;
      border-radius: 20px;
      background: #fff;
      box-shadow:
        0 18px 50px
        rgba(8, 25, 48, .08);
    }

    .gv-bootstrap__brand {
      margin: 0;
      color: #081d38;
      font-size: 30px;
      line-height: 1;
    }

    .gv-bootstrap__brand span {
      display: block;
      margin-top: 8px;
      color: #1769e0;
      font-size: 15px;
      letter-spacing: .18em;
    }

    .gv-bootstrap__status {
      margin: 22px 0 0;
      color: #5d6d80;
    }

    .gv-bootstrap__error {
      color: #a51d2d;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <main
    class="gv-bootstrap"
    aria-live="polite"
  >
    <div class="gv-bootstrap__box">
      <h1 class="gv-bootstrap__brand">
        Global View
        <span>观澜泗渡</span>
      </h1>

      <p
        id="gv-bootstrap-status"
        class="gv-bootstrap__status"
      >
        正在载入正式首页功能并应用测试版视觉……
      </p>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      var SOURCE_PAGE =
        "index.html";

      var STYLE_FILE =
        "home-modern-test.css";

      var SCRIPT_FILE =
        "home-modern-test.js";

      var statusNode =
        document.getElementById(
          "gv-bootstrap-status"
        );

      function fail(error) {
        statusNode.className =
          "gv-bootstrap__status " +
          "gv-bootstrap__error";

        statusNode.textContent =
          "测试页未能载入正式首页。\n\n" +
          "请确认 index-modern-test.html " +
          "与 index.html 位于同一目录，" +
          "并通过已部署的网站地址访问测试页。\n\n" +
          "错误：" +
          (
            error &&
            error.message
              ? error.message
              : String(error)
          );
      }

      fetch(
        SOURCE_PAGE,
        {
          cache: "no-store",
          credentials: "same-origin"
        }
      )
        .then(function (response) {
          if (!response.ok) {
            throw new Error(
              "读取 index.html 失败（HTTP " +
              response.status +
              "）"
            );
          }

          return response.text();
        })
        .then(function (source) {
          if (
            !/<\/head\s*>/i.test(source) ||
            !/<\/body\s*>/i.test(source)
          ) {
            throw new Error(
              "index.html 结构不完整，" +
              "未找到 </head> 或 </body>"
            );
          }

          /*
           * 不解析、不重建、不删改
           * 正式首页的 DOM 与脚本。
           *
           * 只在正式首页原文中追加：
           * 1. noindex 测试标识；
           * 2. 测试版 CSS；
           * 3. 最后执行的增强脚本。
           *
           * 因此正式首页的：
           * - id/class/data-*；
           * - 表单字段；
           * - 全局变量和函数；
           * - 脚本相对顺序；
           * - async/defer/type 属性；
           * 均保持不变。
           */

          var headAddition =
            "\n<meta name=\"robots\" " +
            "content=\"noindex,nofollow\">" +
            "\n<meta name=\"gv-modern-test\" " +
            "content=\"true\">" +
            "\n<link rel=\"stylesheet\" " +
            "href=\"" +
            STYLE_FILE +
            "\">\n";

          var bodyAddition =
            "\n<script defer src=\"" +
            SCRIPT_FILE +
            "\"><\/script>\n";

          source = source.replace(
            /<\/head\s*>/i,
            headAddition +
            "</head>"
          );

          source = source.replace(
            /<\/body\s*>/i,
            bodyAddition +
            "</body>"
          );

          document.open();
          document.write(source);
          document.close();
        })
        .catch(fail);
    }());
  </script>
</body>
</html>
