name: WeChat automatic collection

on:
  workflow_dispatch:
  schedule:
    - cron: "25 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: wechat-automatic-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Discover candidates
        run: |
          set -euo pipefail
          node scripts/wechat-search.mjs

      - name: Install browser
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Resolve real WeChat links
        run: |
          set -euo pipefail
          node scripts/wechat-resolve.mjs

      - name: Archive WeChat articles
        run: |
          set -euo pipefail
          node scripts/pr-wechat-articles.mjs

      - name: Validate archive
        run: |
          set -euo pipefail

          test -f content/pr-portfolio/wechat-articles.json

          node -e 'const fs=require("fs");const items=JSON.parse(fs.readFileSync("content/pr-portfolio/wechat-articles.json","utf8"));if(!Array.isArray(items)||items.length===0)throw new Error("微信归档为空");const good=items.filter(x=>x.source_url&&x.title&&x.body&&String(x.body).length>=500);if(!good.length)throw new Error("没有可用的完整微信文章");console.log("微信归档："+items.length+" 篇；完整正文："+good.length+" 篇");'

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add wechat-candidates.json wechat-news.json content/pr-portfolio/wechat-articles.json

          if git diff --cached --quiet; then
            echo "没有新增微信文章"
            exit 0
          fi

          git commit -m "chore: automatically collect WeChat articles"
          git pull --rebase origin main
          git push origin HEAD:main
