
name: PR WeChat History Search Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-bing-html:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Bing result HTML
        run: |
          node --input-type=module <<'NODE'
          const title = 'AI制药的“淘金热”里，金斯瑞正在抢一把什么样的铲子？';
          const query = `site:mp.weixin.qq.com/s "${title}"`;
          const url = 'https://www.bing.com/search?q=' + encodeURIComponent(query);

          const response = await fetch(url, {
            headers: {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'
            },
            redirect: 'follow',
            signal: AbortSignal.timeout(25000)
          });

          const html = await response.text();

          console.log('HTTP 状态：' + response.status);
          console.log('页面长度：' + html.length);

          for (const term of [
            'mp.weixin.qq.com',
            'bing.com/ck/a',
            'b_algo',
            'b_results',
            'AI制药',
            'captcha',
            '验证'
          ]) {
            const positions = [];
            let start = 0;

            while (positions.length < 5) {
              const index = html.toLowerCase().indexOf(term.toLowerCase(), start);
              if (index < 0) break;
              positions.push(index);
              start = index + term.length;
            }

            console.log('\n关键词：' + term);
            console.log('出现次数（最多显示5处）：' + positions.length);

            for (const index of positions) {
              console.log(
                html.slice(Math.max(0, index - 250), Math.min(html.length, index + 600))
                  .replace(/\s+/g, ' ')
              );
              console.log('---');
            }
          }
          NODE
