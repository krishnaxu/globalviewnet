name: PR WeChat History Search Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-original-links:
    runs-on: ubuntu-latest
    steps:
      - name: Search Bing and DuckDuckGo
        run: |
          node --input-type=module <<'NODE'
          const titles = [
            'AI制药的“淘金热”里，金斯瑞正在抢一把什么样的铲子？',
            '死亡风险降低32%，生存期延长近7个月！默沙东/科伦博泰TROP2 ADC攻克子宫内膜癌治疗难关'
          ];

          const engines = [
            {
              name: 'Bing',
              url: q => 'https://www.bing.com/search?q=' + encodeURIComponent(q)
            },
            {
              name: 'DuckDuckGo',
              url: q => 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(q)
            }
          ];

          function decodeHtml(s) {
            return s
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&#39;|&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>');
          }

          for (const title of titles) {
            console.log('\n====================================');
            console.log('标题：' + title);

            for (const engine of engines) {
              console.log('\n搜索引擎：' + engine.name);

              try {
                const query = `site:mp.weixin.qq.com/s "${title}"`;
                const response = await fetch(engine.url(query), {
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36',
                    'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'
                  },
                  redirect: 'follow',
                  signal: AbortSignal.timeout(20000)
                });

                const html = decodeHtml(await response.text());
                console.log('HTTP 状态：' + response.status);
                console.log('最终页面：' + response.url);
                console.log('页面长度：' + html.length);

                const links = new Set();
                const pattern = /https?:\/\/mp\.weixin\.qq\.com\/s\/[A-Za-z0-9_-]+/g;

                for (const match of html.matchAll(pattern)) {
                  links.add(match[0]);
                }

                console.log('识别到的微信原文链接数：' + links.size);
                for (const link of [...links].slice(0, 10)) {
                  console.log('原文链接：' + link);
                }

                const cleanText = html
                  .replace(/<script[\s\S]*?<\/script>/gi, ' ')
                  .replace(/<style[\s\S]*?<\/style>/gi, ' ')
                  .replace(/<[^>]+>/g, ' ')
                  .replace(/\s+/g, ' ');

                console.log('页面内容预览：' + cleanText.slice(0, 500));
              } catch (error) {
                console.log('查询失败：' + error.message);
              }
            }
          }
          NODE
