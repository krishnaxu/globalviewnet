name: WeChat candidate discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "25 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: wechat-candidate-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Discover WeChat candidates
        run: |
          set -euo pipefail
          node scripts/wechat-search.mjs

      - name: Validate candidates
        run: |
          set -euo pipefail
          test -f wechat-candidates.json

          node -e 'const fs=require("fs");const items=JSON.parse(fs.readFileSync("wechat-candidates.json","utf8"));if(!Array.isArray(items)||items.length===0)throw new Error("候选文章为空");for(const item of items){if(!item.title||!item.search_url)throw new Error("候选文章缺少标题或搜索链接");}console.log("候选文章数量："+items.length);'

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add wechat-candidates.json

          if git diff --cached --quiet; then
            echo "候选文章没有变化"
            exit 0
          fi

          git commit -m "chore: update WeChat article candidates"
          git pull --rebase origin main
          git push origin HEAD:main
